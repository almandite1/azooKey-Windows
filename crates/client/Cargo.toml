[package]
name = "azookey-windows"
version.workspace = true
edition = "2024"
resolver = "2"

[lib]
crate-type = ["cdylib"]

# a panic unwinding out of a COM callback aborts the HOST application, so
# unwrap/expect are banned in this crate (catch_unwind in macros::anyhow is
# the last line of defense, not a license to panic)
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
anyhow = { workspace = true }
log = "0.4"
fern = "0.7.0"
chrono = { workspace = true }
windows-core = { workspace = true }
shared = { workspace = true }
macros = { workspace = true }
tonic = { workspace = true }
# "time" is used directly (ipc_service::timeout); it currently only builds
# because tonic pulls it in via feature unification — declare it explicitly
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-core = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_Networking_WinSock"
]

[build-dependencies]
embed-resource = { workspace = true }
