[package]
name = "ui"
version.workspace = true
edition = "2024"

[build-dependencies]
embed-resource = { workspace = true }

[dependencies]
anyhow = { workspace = true }
tao = "0.35.0"
wry = "0.55.0"
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
shared = { workspace = true }
azookey-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    # monitor geometry for clamping the candidate window to the work area;
    # another feature this crate used to get only by unification, this time
    # from the pre-0.55 wry
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    # PRIVILEGE_SET_ALL_NECESSARY, for the UIAccess token check
    "Win32_System_SystemServices",
    # the UIAccess supervision shim ties its re-exec child to a
    # kill-on-close job, like the launcher does for its children
    "Win32_System_JobObjects",
    # NotifyWinEvent, for the light-dismiss EVENT_OBJECT_IME_* notifications
    "Win32_UI_Accessibility",
    # this crate calls ShowWindow/SetWindowPos/SetWindowLongW directly; it
    # used to reach them only through feature unification with crates/client
    "Win32_UI_WindowsAndMessaging"
]

# The display tests (tests/window_display.rs) drive a real ui.exe and read
# back what it put on screen. Their extra bindings live here rather than in
# [dependencies] so the shipped binary keeps the feature set above: dev
# dependencies are not part of a plain `cargo build`.
[dev-dependencies]
tonic-health = { workspace = true }
# the Win32 observation layer, shared with the E2E harness. A DEV dependency:
# these are test bindings and must not reach the shipped ui.exe.
test-support = { workspace = true }

[dev-dependencies.windows]
workspace = true
features = [
    # GetDpiForWindow: sizes are decided in CSS px and applied as LogicalSize,
    # so the assertions have to convert the measured pixels back
    "Win32_UI_HiDpi",
]