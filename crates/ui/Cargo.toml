[package]
name = "ui"
version.workspace = true
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tao = "0.31.0"
wry = "0.47.2"
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
shared = { workspace = true }
azookey-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    # the UIAccess supervision shim ties its re-exec child to a
    # kill-on-close job, like the launcher does for its children
    "Win32_System_JobObjects",
    # NotifyWinEvent, for the light-dismiss EVENT_OBJECT_IME_* notifications
    "Win32_UI_Accessibility",
    # this crate calls ShowWindow/SetWindowPos/SetWindowLongW directly; it
    # used to reach them only through feature unification with crates/client
    "Win32_UI_WindowsAndMessaging"
]