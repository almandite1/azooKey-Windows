<!-- lang matters for a screen reader: without it the candidates are read
     with the reader's default language voice, mispronouncing kana. -->
<html lang="ja">
    <head>
        <!-- Required now that the markup carries a Japanese aria-label.
             The candidate text itself arrives through textContent and is
             encoding-safe, which is why nothing needed this before. -->
        <meta charset="utf-8">
        <style>
{theme_css}
{user_theme_css}
{candidate_css}
        </style>
        <script>
{candidate_js}
        </script>
    </head>
    <body style="margin: 0;">
        <main>
            <!-- role is explicit because candidate.css sets
                 `list-style-type: none`, which makes Chromium drop the
                 implicit list semantics of <ol>/<li>. aria-activedescendant
                 is how the selection is announced: this window is
                 WS_EX_NOACTIVATE and never takes focus, so there is no real
                 focus to follow. -->
            <ol id="candidate-list"
                role="listbox"
                aria-label="変換候補"
                aria-orientation="vertical">
            </ol>
            <footer>
                <svg width="20" height="14" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.5 8C4.59202 9.04403 7.54398 10.3978 13.5068 9.93754M1.25349 5.39919C2.77722 0.413397 8.08911 0.79692 10.9673 1.24436C14.2687 1.71311 20.8969 3.82675 20.9985 8.53129C21.1255 14.412 13.1894 15.3069 10.0784 14.9233C6.96748 14.5398 -0.46071 13.0696 1.25349 5.39919Z" stroke="#838384" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </footer>
        </main>
    </body>
</html>
