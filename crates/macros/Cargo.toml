[package]
name = "macros"
version.workspace = true
edition = "2021"

[lib]
proc-macro = true

# the MSVC linker always reports creating the .lib/.exp for a proc-macro
# dylib on stdout; that message is noise, not a problem
[lints.rust]
linker_messages = "allow"

[dependencies]
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"

# the generated code names anyhow, tracing and windows; the integration
# tests are a separate crate, so they need them to compile it
[dev-dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies.windows]
workspace = true
features = ["Win32_Foundation"]