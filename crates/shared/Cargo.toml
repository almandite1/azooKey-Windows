[package]
name = "shared"
version.workspace = true
edition = "2024"
resolver = "2"

[dependencies]
prost = { workspace = true }
tonic = { workspace = true }
# the generated service code names tonic_prost::ProstCodec, which moved out
# of tonic proper in 0.14
tonic-prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# rt-multi-thread: `pipe::blocking_channels` builds the runtime its callers
# (the TIP, the settings app) block on
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
tower = "0.5.1"
hyper-util = { version = "0.1.9", features = ["tokio"] }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # kill-on-close job objects (job.rs), shared by launcher and ui
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[build-dependencies]
tonic-prost-build = { workspace = true }
