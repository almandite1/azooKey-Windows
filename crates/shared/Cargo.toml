[package]
name = "shared"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
prost = "0.13.4"
tonic = "0.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.42.0", features = ["net", "time"] }
tower = "0.5.1"
hyper-util = { version = "0.1.9", features = ["tokio"] }

[dependencies.windows]
version = "0.58.0"
features = ["Win32_Foundation"]

[build-dependencies]
tonic-build = "0.12.3"
