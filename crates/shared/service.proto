syntax = "proto3";

package azookey;

message Suggestion {
  string text = 1;    // The main suggestion text.
  string subtext = 2; // Additional information or subtext for the suggestion.
  // Romaji keystrokes this candidate covers, for the client's own raw input.
  int32 corresponding_count = 3;
  // Kana of the reading this candidate covers. This is the count ShrinkText
  // takes; the two differ when a clause boundary falls inside a romaji
  // cluster (kanshi|ya), which no keystroke count can express.
  int32 surface_count = 4;
}

// ComposingText represents the text and its associated suggestions.
message ComposingText {
  string hiragana = 1; // The main text content.
  repeated Suggestion suggestions = 2; // List of suggestions for the text.
}

// Request message for AppendText.
message AppendTextRequest {
  string text_to_append = 1; // The text to append to the current content.
}

// Response message for AppendText.
message AppendTextResponse {
  ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Request message for RemoveText.
message RemoveTextRequest {
  // How many kana to delete from the end of the reading. Held Backspace
  // autorepeats at ~30 Hz and the host coalesces the presses into one message;
  // sending them one at a time meant one full reconversion (neural inference
  // included) per kana, which is what made a long press lag. The server
  // deletes `count` kana and converts once.
  //
  // Field 1 was free: this message was empty before. A TIP from before the
  // change sends nothing, so the server reads 0 and clamps it back up to 1 —
  // the old one-kana-per-call behaviour, which is exactly right for it.
  int32 count = 1;
}

// Response message for RemoveText.
message RemoveTextResponse {
  ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Request message for MoveCursor.
message MoveCursorRequest {
  // How far to move, in kana, relative to where the cursor is now — not the
  // position to move to. It is clamped to the ends of the reading. The reply
  // carries no cursor field yet; when one is added it must be the absolute
  // position, matching the FFI out-parameter (#82).
  int32 offset = 1;
}

// Request message for ShrinkText.
message ShrinkTextRequest {
  // 1 was `offset`, a keystroke count. The engine now shrinks by kana, so
  // the field was renumbered rather than redefined: a client from before
  // the change sends 1, the server reads 0 and shrinks nothing, instead of
  // silently cutting the reading at the wrong place.
  reserved 1;
  reserved "offset";
  int32 surface_offset = 2;
  // Which candidate the user accepted, as an index into the list the
  // candidate window was showing. Present means a confirmation the engine
  // should learn from; absent means a discard, or a TIP from before this
  // field existed — either way, nothing is learned.
  //
  // `optional` rather than a plain int32 because index 0 is the commonest
  // value there is (the top candidate), and proto3's zero-default cannot
  // tell it apart from "not sent".
  optional int32 candidate_index = 3;
}

message ShrinkTextResponse {
    ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Response message for MoveCursor.
message MoveCursorResponse {
  ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Request message for ClearText.
message ClearTextRequest {
  // The same field as in ShrinkTextRequest, and it is what separates the two
  // things this one RPC does: ending a composition by confirming it (present)
  // and ending it by throwing it away — Escape, focus loss, a host-terminated
  // composition (absent). Field 1 was free; this message was empty.
  optional int32 candidate_index = 1;
}

// Response message for ClearText.
message ClearTextResponse {}

// Forgets everything the engine has learned from confirmed conversions.
//
// Its own RPC rather than a flag on UpdateConfig: UpdateConfig is sent on
// every save the settings app makes, and a destructive action must not ride
// along on a message that frequent.
message ResetLearningRequest {}
message ResetLearningResponse {}

message SetContextRequest {
  string context = 1;
}

message SetContextResponse {}

message UpdateConfigRequest {}
message UpdateConfigResponse {}


// Service definition for text editing operations.
service AzookeyService {
  rpc AppendText (AppendTextRequest) returns (AppendTextResponse);
  rpc RemoveText (RemoveTextRequest) returns (RemoveTextResponse);
  rpc ShrinkText (ShrinkTextRequest) returns (ShrinkTextResponse);
  rpc MoveCursor (MoveCursorRequest) returns (MoveCursorResponse);
  rpc ClearText (ClearTextRequest) returns (ClearTextResponse);
  rpc SetContext (SetContextRequest) returns (SetContextResponse);
  rpc UpdateConfig (UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc ResetLearning (ResetLearningRequest) returns (ResetLearningResponse);
}
