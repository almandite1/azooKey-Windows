[package]
name = "azookey-e2e"
version.workspace = true
edition = "2024"

# Tier 2 of docs/e2e-automation-plan.md: drives the IME through a real host
# application with synthesised keystrokes. It switches the DEFAULT INPUT
# METHOD of whoever runs it and types into whatever has focus, so it belongs
# in the test VM and nowhere else — `cargo make e2e` is the only supported
# way to run it, and the binary refuses to start outside a VM.

[dependencies]
anyhow = { workspace = true }
# only for shared::logs: the harness scans the very directory the components
# write to, so it must not carry its own copy of that path
shared = { workspace = true }
# the Win32 observation helpers this harness shares with the ui display tests
test-support = { workspace = true }

# the custom host binary (src/bin/azookey-e2e-host.rs) is a Win32 GUI, so it
# is not a plain console exe — but it is launched by the harness, not
# double-clicked, and a console would flash. windows_subsystem in the file
# handles that.

[dependencies.windows]
workspace = true
features = [
    # LocaleNameToLCID, for the ja-JP language id the profile is registered under
    "Win32_Globalization",
    # HBRUSH / COLOR_WINDOW / GetClientRect for the custom host window
    "Win32_Graphics_Gdi",
    # CoCreateInstance for the TSF profile manager
    "Win32_System_Com",
    # GetModuleHandleW, for the custom host's window class
    "Win32_System_LibraryLoader",
    # IUIAutomation: reading back what the host application actually received
    "Win32_UI_Accessibility",
    # SendInput / SetFocus
    "Win32_UI_Input_KeyboardAndMouse",
    # ITfInputProcessorProfiles::SetDefaultLanguageProfile
    "Win32_UI_TextServices",
    # EnumWindows / SetForegroundWindow / CreateWindowExW / the message loop
    "Win32_UI_WindowsAndMessaging",
]
