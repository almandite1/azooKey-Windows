[package]
name = "azookey-server"
version.workspace = true
edition = "2021"
resolver = "2"

[dependencies]
# the server runs a deliberately single-threaded current_thread runtime
# (the Swift FFI is not thread-safe) — no need for the "full" feature set
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
tonic = { workspace = true }
tonic-reflection = { workspace = true }
tonic-health = { workspace = true }
shared = { workspace = true }
async-stream = "0.3.6"
futures-core = "0.3.31"

[dependencies.windows]
workspace = true
features = [
    "Win32_Security_Authorization",
]

