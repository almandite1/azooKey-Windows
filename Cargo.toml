[workspace]
resolver = "2"
members = [
  "crates/client",
  "crates/server",
  "crates/shared",
  "crates/ui",
  "crates/macros",
  "crates/launcher",
  "frontend/src-tauri"
]

# THE single source of the product version. Everything else derives from it:
# crates inherit via version.workspace = true, the Tauri settings app falls
# back to its Cargo.toml version (tauri.conf.json deliberately omits
# "version"), the Inno installer gets installer/Version.iss generated from
# this value by the build_installer task, and the settings UI shows it via
# getVersion().
[workspace.package]
version = "0.1.0-alpha.2"

# Single place to bump shared dependency versions. Crates opt in with
# `dep.workspace = true` and may add crate-specific features on top.
[workspace.dependencies]
# internal
shared = { path = "crates/shared" }
macros = { path = "crates/macros" }
azookey-server = { path = "crates/server" }
# external — the tonic/prost family must move in lockstep. Since 0.14 the
# prost codec lives outside tonic itself, so the generated code needs
# tonic-prost at run time and tonic-prost-build at build time.
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
tokio = "1.42.0"
# the windows family must move in lockstep
windows = "0.62.2"
windows-core = "0.62.2"
anyhow = "1.0"
chrono = "0.4.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-core = "0.1.33"
# icons for the TIP, the application manifest for ui.exe
embed-resource = "3.0.11"
