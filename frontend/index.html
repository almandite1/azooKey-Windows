<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azookey</title>
    <script>
      // paint the right theme from the first frame; ThemeProvider only gets to
      // touch the class list after React mounts, which is one white flash late.
      // the storage key and the class names must match theme-provider.tsx.
      (function () {
        // the allow-list matters: classList.add THROWS on a value with a
        // space in it, and this whole script would die with it -- bringing
        // back the flash it is here to prevent, silently. Kept in step with
        // readStoredTheme in components/theme-provider.tsx, which cannot be
        // imported from here.
        var t;
        try {
          t = localStorage.getItem("vite-ui-theme");
        } catch (e) {
          t = null;
        }
        if (t !== "light" && t !== "dark" && t !== "system") {
          t = "system";
        }
        if (t === "system") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(t);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
