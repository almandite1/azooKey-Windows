# makefile for cargo
[config]
default_to_workspace = false

[tasks.format]
command = "cargo"
args = ["fmt"]

[tasks.build_swift]
description = "Build the swift code"
script_runner = "@shell"
script = """
cd server-swift
swift build -c release
cp .build/x86_64-unknown-windows-msvc/release/azookey-server.lib ../
"""

[tasks.test_swift]
description = "Run the Swift package tests (the runner loads llama.dll at start)"
script_runner = "powershell"
script_extension = "ps1"
script = """
$ErrorActionPreference = "Stop"
# the test runner links the engine, which pulls in llama.dll at load time;
# it ships in llama_cpu/ and is not on PATH. Forward slashes on purpose:
# a multi-line TOML string processes backslash escapes.
$env:Path = "$PWD/llama_cpu;$env:Path"
cd server-swift
swift test
if ($LASTEXITCODE -ne 0) { throw "swift test failed with exit code $LASTEXITCODE" }
"""

# Deliberately NOT in the `build` flow below: that flow is the release
# pipeline, and `swift test` builds the dependency graph again with
# testability enabled — output post_build must never pick up.

# Tier 1 of docs/e2e-automation-plan.md. Excluded from `cargo test` by
# #[ignore] because it starts a real ui.exe: it needs an interactive desktop
# and the WebView2 runtime, but no TIP registration, no keystroke injection
# and no conversion engine — so unlike Tier 2 it is safe to run on a working
# machine, alongside the installed IME.
#
# Serial by choice, not by need: the tests are isolated from each other (own
# pipe, own WebView2 profile, hwnd-filtered event log) and pass in parallel
# too, but ten simultaneous WebView2 stacks make the timing assertions a
# measure of the machine's load rather than of the window's behaviour.
[tasks.test_ui_display]
description = "Run the candidate-window display tests against a real ui.exe"
script_runner = "powershell"
script_extension = "ps1"
script = """
$ErrorActionPreference = "Stop"
$flags = @($args | Where-Object { $_ -and $_ -ne '--debug' })
# ui.exe must exist next to the test binary; the harness runs the build it
# was compiled alongside (override with AZOOKEY_UI_EXE)
cargo build -p ui @flags
if ($LASTEXITCODE -ne 0) { throw "cargo build -p ui failed with exit code $LASTEXITCODE" }

cargo test -p ui --test window_display @flags -- --ignored --test-threads=1
if ($LASTEXITCODE -ne 0) { throw "the display tests failed with exit code $LASTEXITCODE" }
"""
args = ["${@}"]

# `cargo make build --debug` is documented (README) and the rest of the flow
# accepts it — post_build maps `--debug`/`--release`/nothing onto the target
# subdirectory. cargo itself has no `--debug` flag though (debug IS its
# default), so forwarding the argument verbatim made the documented command
# fail outright. cargo-make's command+args form cannot branch on an argument,
# hence the script (issue #5).
[tasks.build_x64]
script_runner = "powershell"
script_extension = "ps1"
script = """
$ErrorActionPreference = "Stop"
$flags = @($args | Where-Object { $_ -and $_ -ne '--debug' })
cargo build @flags
if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
"""
args = ["${@}"]

[tasks.build_x86]
script_runner = "powershell"
script_extension = "ps1"
script = """
$ErrorActionPreference = "Stop"
$flags = @($args | Where-Object { $_ -and $_ -ne '--debug' })
cargo build -p azookey-windows --target=i686-pc-windows-msvc @flags
if ($LASTEXITCODE -ne 0) { throw "cargo build (i686) failed with exit code $LASTEXITCODE" }
"""
args = ["${@}"]

# Tier 2 of docs/e2e-automation-plan.md, host side. Stages exactly what the
# test VM needs into one archive: `Copy-Item -ToSession` is per-file and the
# dictionary alone is 4,200 of them, so a single zip is the difference between
# seconds and many minutes.
#
# Deliberately NOT the whole of build/: that directory accumulates every
# renamed TIP DLL of every batch, the installer, and the CUDA/Vulkan backends.
# llama_cpu IS included even though Zenzai runs off — the Swift engine links
# llama.dll at load time, so the server will not start without it.
[tasks.e2e_payload]
description = "Stage the artifacts the E2E test VM needs into one archive"
script_runner = "powershell"
script_extension = "ps1"
script = """
$ErrorActionPreference = "Stop"
$flags = @($args | Where-Object { $_ -and $_ -ne '--debug' })
$profileDir = if ($flags -contains '--release') { 'release' } else { 'debug' }

cargo build -p azookey-e2e @flags
if ($LASTEXITCODE -ne 0) { throw "cargo build -p azookey-e2e failed with exit code $LASTEXITCODE" }

if (-not (Test-Path "build/launcher.exe")) {
    throw "build/ is empty; run cargo make build first"
}

$stage = Join-Path $env:TEMP "azookey-e2e-payload"
Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
New-Item -ItemType Directory $stage | Out-Null

# no renamed DLLs from past batches, no installer, no spare copies
Get-ChildItem build -File | Where-Object {
    $_.Name -notmatch '^azookey_windows_' -and $_.Name -notmatch '\\.prev\\.' -and
    $_.Name -notmatch 'azookey-setup|zenz-v3-backup|ui_release_prev|launch_dev'
} | Copy-Item -Destination $stage

foreach ($d in 'Dictionary', 'EmojiDictionary', 'llama_cpu', 'x86') {
    Copy-Item "build/$d" $stage -Recurse
}

Copy-Item "target/$profileDir/azookey-e2e.exe" $stage
# the second host for scenario 3 (bin/host.rs); the harness launches it by
# name from beside itself
Copy-Item "target/$profileDir/azookey-e2e-host.exe" $stage

$zip = Join-Path $env:TEMP "azookey-e2e.zip"
Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
# no -f format strings: cargo-make mangles brace placeholders
$mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
Write-Host "payload: $zip ($mb MB)"
"""
args = ["${@}"]

[tasks.build_tauri]
description = "Build the Tauri settings app"
script_runner = "@shell"
script = """
cd frontend
npm run tauri build
"""

[tasks.build_installer]
description = "Generate installer/Version.iss from the workspace version, then compile the installer"
script_runner = "powershell"
script_extension = "ps1"
script = """
$ErrorActionPreference = "Stop"

# single source of the product version: [workspace.package] in Cargo.toml.
# The anchored ^version match only hits that line (dependency pins are all
# `name = "..."` entries).
$match = Select-String -Path "Cargo.toml" -Pattern '^version\\s*=\\s*"([^"]+)"' | Select-Object -First 1
if ($null -eq $match) { throw "workspace version not found in Cargo.toml" }
$version = $match.Matches[0].Groups[1].Value

Set-Content -Path "installer/Version.iss" -Encoding ascii -Value @(
  "; GENERATED by cargo-make (build_installer) from [workspace.package]",
  "; version in the root Cargo.toml - do not edit, do not commit",
  "#define MyAppVersion `"$version`"",
  "#define TauriAppVersion `"$version`""
)

iscc ./installer/Installer.iss
if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }
"""

[tasks.post_build]
description = "Copy necessary files"
script_runner = "powershell"
script_extension = "ps1"
script  = """
# fail fast: a missing artifact must fail the build, not ship a broken
# installer (previously the exit code was whatever the last icacls returned)
$ErrorActionPreference = "Stop"

$str=$args[0]
if ([string]::IsNullOrEmpty($str)) {
    $str = "debug"
} else {
    $str=$str.Substring(2)
}


mkdir build/x86 -Force | Out-Null

cp target/$str/ui.exe build
cp target/$str/azookey-server.exe build
cp target/$str/azookey_windows.dll build
cp target/$str/launcher.exe build


cp target/i686-pc-windows-msvc/$str/azookey_windows.dll build/x86

cp server-swift/.build/x86_64-unknown-windows-msvc/release/azookey-server.dll build

cp -Recurse -Force llama_cpu build
cp -Recurse -Force llama_cuda build
cp -Recurse -Force llama_vulkan build

# pick ONE Swift runtime deterministically (the newest); a wildcard over all
# installed runtimes let a random mix of versions end up in the installer
$runtimeRoot = Join-Path $env:LOCALAPPDATA "Programs/Swift/Runtimes"
$runtime = Get-ChildItem $runtimeRoot -Directory |
    Sort-Object { [version]$_.Name } -Descending |
    Select-Object -First 1
if ($null -eq $runtime) { throw "no Swift runtime found under $runtimeRoot" }
Write-Host "bundling Swift runtime $($runtime.Name)"

# Copy only what actually differs. The runtime changes when the toolchain is
# replaced and at no other time, so on a normal build every one of these files
# is already byte-identical -- and copying them anyway is what breaks the
# build: build/ is where the TIP DLL is registered from, so every process that
# loaded the IME holds build/vcruntime140.dll through the DLL search path.
# Stopping the engine does not release it; only closing every app that has
# ever used the IME would. Skipping the identical case keeps that lock
# irrelevant, and a real toolchain change still gets copied.
$copied = 0
foreach ($src in Get-ChildItem "$($runtime.FullName)/usr/bin" -File) {
    $dest = Join-Path "build" $src.Name
    if ((Test-Path $dest) -and
        ((Get-Item $dest).Length -eq $src.Length) -and
        ((Get-FileHash $dest).Hash -eq (Get-FileHash $src.FullName).Hash)) {
        continue
    }
    try {
        Copy-Item $src.FullName $dest -Force -ErrorAction Stop
        $copied++
    } catch [System.IO.IOException] {
        throw "post_build: cannot replace build/$($src.Name) because a running " +
              "process holds it. The IME is loaded into every app that has used " +
              "it, and those apps pin this file. Close them (Explorer included) " +
              "and build again. Underlying error: $($_.Exception.Message)"
    }
}
Write-Host "Swift runtime: $copied of $((Get-ChildItem "$($runtime.FullName)/usr/bin" -File).Count) files needed updating"

cp -Recurse -Force server-swift/azooKey_emoji_dictionary_storage/EmojiDictionary build
cp -Recurse -Force server-swift/azooKey_dictionary_storage/Dictionary build

cp zenz.gguf build

# required artifacts must exist before the installer step
$required = @(
    "build/ui.exe",
    "build/azookey-server.exe",
    "build/azookey-server.dll",
    "build/azookey_windows.dll",
    "build/launcher.exe",
    "build/x86/azookey_windows.dll",
    "build/zenz.gguf",
    "build/llama_cpu/llama.dll",
    "build/swiftCore.dll",
    "build/dispatch.dll",
    "build/Dictionary",
    "build/EmojiDictionary"
)
foreach ($f in $required) {
    if (-not (Test-Path $f)) { throw "post_build: missing required artifact: $f" }
}

icacls build/azookey_windows.dll /grant "*S-1-15-2-1:(RX)"
if ($LASTEXITCODE -ne 0) { throw "icacls failed for build/azookey_windows.dll" }
icacls build/x86/azookey_windows.dll /grant "*S-1-15-2-1:(RX)"
if ($LASTEXITCODE -ne 0) { throw "icacls failed for build/x86/azookey_windows.dll" }
"""
args = ["${@}"]

[tasks.build]
clear = true
description = "Run the flow"
dependencies = [
    "format",
    "build_swift",
    "build_x64",
    "build_x86",
    "build_tauri",
    "post_build",
    "build_installer"
]