# Named for what it covers, not for one of the languages in it: this builds
# and tests Swift, Rust (x64 and x86), the Tauri app and the installer. The
# name is also the left-hand label of the README's status badge.
name: CI

on:
  # a docs-only change cannot break a 25 min Windows build
  push:
    # only the long-lived branches: a push to a PR branch is already covered by
    # the pull_request trigger below, and without this filter every Dependabot
    # rebase costs two full Windows builds of the same commit
    branches:
      - dev
      - master
    # a release is cut by pushing a version tag; the release job below turns
    # that build's installer into a GitHub Release
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# a newer push to the same branch supersedes the running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# the build writes nothing back; only the release job below does, and it
# raises this for itself rather than granting write to every job
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # a healthy run is ~25 min; past an hour it is hung, not slow, and the
    # 6 h default would sit on the runner until someone noticed
    timeout-minutes: 60

    # the pins for the prebuilt downloads live here rather than inline,
    # because the cache key is built from them: a cache hit skips the
    # download step entirely, so a key that did not carry the checksums
    # served the old bytes forever and the verification below never ran
    env:
      LLAMA_CPU_SHA256: AF34E4DFC7154DF650ED705421F26B3A56C685F2E35ABFDD6DF0CC0CB5C4B259
      LLAMA_CUDA_SHA256: 5307B89AAE1F076E031D6AAB95E63DF5CB96B8D3B1FA7828F412E283A0663019
      LLAMA_VULKAN_SHA256: ED1B7E6AA70CDB2A93EAAAD8586539DCE83F4FA8A44F4DDEE5A1AB09FFB1189B
      ZENZ_SHA256: 29C223D4C23327B80FD13EBB5AB2555057A46317997D5DA391584FFBEF0DB673

    # every `uses:` below is pinned to a full commit SHA rather than a tag,
    # because tags can be moved after the fact. The downloads further down are
    # SHA256-verified for the same reason; floating tags here would have been
    # the weak link. Dependabot (.github/dependabot.yml) bumps the SHAs and
    # rewrites the trailing version comment, so this stays maintainable.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    # first, because it compiles nothing and so reports a formatting problem in
    # seconds rather than after the Swift toolchain and a full build. `cargo
    # make build` starts with a plain `cargo fmt`, which rewrites files on the
    # runner and would let unformatted code merge unnoticed; this is the gate
    # that actually fails.
    - name: Format
      run: cargo fmt --all -- --check

    - name: Cache Rust
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    # 6.3.3 matches the locally verified toolchain (devenv.bat); newer SDKs
    # no longer need the ucrt.modulemap patch the 6.0.2 setup fetched from a
    # personal gist.
    - name: Install Swift
      uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
      with:
        swift-version: swift-6.3.3-release
        swift-build: 6.3.3-RELEASE

    # still node20 upstream (no newer release exists), so the runner forces it
    # onto node24 and warns; nothing to bump until arduino ships a node24 build
    - name: Install Protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        # this action resolves the protoc release through the GitHub API, and
        # unauthenticated it shares an hourly quota with every other build on
        # the runner's IP. That is what failed PR #41's push run. The token
        # only needs the read access the job already has.
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install x86 Rust target
      run: rustup target add i686-pc-windows-msvc

    # a checksum-verified prebuilt binary; `cargo install` rebuilt it from
    # source on every run and cost ~4.5 min of the ~25 min total
    - name: Install cargo-make
      uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
      with:
        tool: cargo-make

    # ~600 MB of pinned artifacts (three llama zips + the zenz model). The
    # key carries every checksum the job verifies, so changing a pin — or
    # re-pinning after an upstream tag is moved — misses the cache and the
    # download step re-verifies. Keying on the release tag alone was not
    # enough: a hit skips the verification with it.
    - name: Cache prebuilt llama and zenz model
      id: cache-prebuilt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          llama_cpu
          llama_cuda
          llama_vulkan
          server-swift/llama.lib
          zenz.gguf
        key: prebuilt-llama-b4846-${{ env.LLAMA_CPU_SHA256 }}-${{ env.LLAMA_CUDA_SHA256 }}-${{ env.LLAMA_VULKAN_SHA256 }}-${{ env.ZENZ_SHA256 }}

    - name: Download prebuilt llama
      if: steps.cache-prebuilt.outputs.cache-hit != 'true'
      run: |
        # every downloaded artifact is pinned by SHA256: a moved release tag
        # or tampered file fails the build instead of shipping silently
        function Download-Verify-Extract {
          param (
            [string]$url,
            [string]$destFolder,
            [string]$sha256
          )
          $tempZip = Join-Path $env:TEMP "llama_temp.zip"
          Invoke-WebRequest -Uri $url -OutFile $tempZip
          $actual = (Get-FileHash $tempZip -Algorithm SHA256).Hash
          if ($actual -ne $sha256) {
            throw "checksum mismatch for ${url}: expected $sha256, got $actual"
          }
          New-Item -Path $destFolder -ItemType Directory -Force
          Expand-Archive -Path $tempZip -DestinationPath $destFolder -Force
          Remove-Item $tempZip
        }

        # Create directories
        $llamaCpuDir = "llama_cpu"
        $llamaCudaDir = "llama_cuda"
        $llamaVulkanDir = "llama_vulkan"
        New-Item -Path $llamaCpuDir, $llamaCudaDir, $llamaVulkanDir -ItemType Directory -Force

        # Download, verify, and extract files
        Download-Verify-Extract -url "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-avx-x64.zip" -destFolder $llamaCpuDir -sha256 $env:LLAMA_CPU_SHA256
        Download-Verify-Extract -url "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-cuda-cu12.4-x64.zip" -destFolder $llamaCudaDir -sha256 $env:LLAMA_CUDA_SHA256
        Download-Verify-Extract -url "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-vulkan-x64.zip" -destFolder $llamaVulkanDir -sha256 $env:LLAMA_VULKAN_SHA256

        # Copy llama.lib to server-swift
        Copy-Item "$llamaCpuDir\llama.lib" -Destination "server-swift\" -Force

        # Download the zenz model
        $zenzUrl = "https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf"
        $zenzDest = "zenz.gguf"
        Invoke-WebRequest -Uri $zenzUrl -OutFile $zenzDest
        $zenzActual = (Get-FileHash $zenzDest -Algorithm SHA256).Hash
        $zenzExpected = $env:ZENZ_SHA256
        if ($zenzActual -ne $zenzExpected) {
          throw "checksum mismatch for ${zenzUrl}: expected $zenzExpected, got $zenzActual"
        }

    # npm ci: install exactly what package-lock.json pins, or fail
    - name: Install node dependencies
      run: |
        cd frontend
        npm ci

    - name: Build
      run: cargo make build --release

    # after Build so azookey-server.lib exists for linking the server's
    # test harness; --ignored FFI smoke tests need a live server and are
    # excluded by default
    - name: Test
      run: cargo test --workspace --release

    # the Swift package's own suite (swift-testing); `cargo test` above only
    # covers the Rust side. After Build so the package graph is already
    # fetched and the installer is already packaged — this build enables
    # testability and must not feed post_build.
    - name: Test (Swift)
      run: cargo make test_swift

    - name: Clippy
      run: cargo clippy --workspace --all-targets --release -- -D warnings

    # The x86 TIP DLL was built but never checked. Everything above runs on the
    # host x64 only, so nothing caught code that is correct at 64-bit pointer
    # width and wrong at 32-bit — the class of bug the FFI pointer-width fix
    # dealt with. Both steps reuse the release artifacts cargo make already
    # produced for this target, and the 32-bit test binary runs under WOW64.
    - name: Clippy (x86)
      run: cargo clippy -p azookey-windows --target i686-pc-windows-msvc --all-targets --release -- -D warnings

    - name: Test (x86)
      run: cargo test -p azookey-windows --target i686-pc-windows-msvc --release

    - name: Upload Setup Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: azookey-setup
        path: build/azookey-setup.exe
        if-no-files-found: error
        # the installer bundles the models and is large; nobody reaches for a
        # build older than a couple of weeks, so do not keep it the full 90 days
        retention-days: 14

  # A tag build additionally publishes what it just produced. It takes the
  # artifact from the build job rather than rebuilding: a second build could
  # differ from the one that passed the gates above, and the whole point of a
  # release is that it is the build that was tested.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download the setup artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: azookey-setup

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      # pre-release while the project is pre-1.0: the README says stability is
      # not guaranteed, and the release should say the same thing
      run: |
        gh release create "$TAG" azookey-setup.exe \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" \
          --generate-notes \
          --prerelease
