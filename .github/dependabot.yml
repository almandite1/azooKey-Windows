version: 2

# Policy: dependencies track the newest release, not just the newest release
# that closes a CVE. Security-only updates are a separate, always-on GitHub
# feature; the entries here are *version* updates, which is what keeps the tree
# from drifting far enough that a security bump turns into a migration. The
# tauri/wry situation in issue 51 is what that drift costs.
#
# Minor and patch updates are grouped into one PR per ecosystem, because each
# PR costs a ~16 min Windows build and six separate lockfile diffs buy nothing.
# Major updates deliberately fall outside the groups and arrive one at a time:
# those are the ones that break a build or change an API, and they are worth
# looking at on their own.

updates:
  # Keeps the SHA pins in workflows/actions.yml current. Without this, a
  # deprecation like the node20 one only surfaces as a run annotation that
  # somebody has to notice; here it arrives as a PR that CI has already built.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  # The workspace lockfile, covering every crate including the shipped TIP DLL,
  # the server and the candidate window.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # The Swift package behind the conversion engine. Added with the SBOM work:
  # until then Swift was the one ecosystem here with no version updates and no
  # security alerts at all, because GitHub's dependency graph does not read
  # server-swift/Package.resolved. Dependabot resolves the package graph
  # itself rather than reading the graph, so it covers what the graph misses.
  #
  # Two of the pins are revision pins on a branch (AzooKeyKanaKanjiConverter,
  # swift-tokenizers); Dependabot leaves those alone, which is correct -- they
  # move when the engine is deliberately moved, not on a schedule.
  - package-ecosystem: swift
    directory: /server-swift
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      swift:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # The Tauri settings app. Its lockfile is separate from the Rust one, so it
  # gets its own entry and its own PR.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Every @tauri-apps package has to sit on the same major.minor as its Rust
    # crate in Cargo.lock. `tauri build` rejects a mismatched api or plugin
    # outright, and a mismatched CLI is worse: it emits an installer.nsi whose
    # CheckIfAppIsRunning call the other version's macro refuses, so the NSIS
    # bundle fails after a clean compile.
    #
    # Dependabot updates cargo and npm as separate ecosystems and cannot move
    # the two halves in one PR, so this scope stays out of its hands and is
    # bumped by hand whenever the cargo group moves tauri. Both halves are on
    # the newest release as of this writing; `npx tauri info` lists the pairs.
    ignore:
      - dependency-name: '@tauri-apps/*'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
